[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Typed ingestion adapters and offline tooling for the Ecuador job-market intelligence project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Interactive evidence-desk demo (app/evidence_desk.py). Kept as an optional
# extra so the offline analysis pipeline stays standard-library-only.
demo = [
    "streamlit>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_market_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep the existing ``str``-based enums: their string representation is part of
# the serialized artifacts and must not change to ``StrEnum`` semantics.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# User-facing Spanish copy and inline SVG markup are single long strings; wrapping
# them would alter the rendered text or the generated asset.
"app/evidence_desk.py" = ["E501"]
"scripts/render_p1_evaluation_results.py" = ["E501"]
