[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Typed ingestion adapters and offline tooling for the Ecuador job-market intelligence project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Interactive evidence-desk demo (app/evidence_desk.py). Kept as an optional
# extra so the offline analysis pipeline stays standard-library-only.
demo = [
    "streamlit>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_market_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
